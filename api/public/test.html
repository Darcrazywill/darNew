<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка edit</title>
</head>
<body>
    <form action="http://api.kokoreva.ru:8084/index.php?action=edit&id=2" method="post">
        <p>
            <label>Заголовок:
                <input type="text" name="title" value="Новый заголовок">
            </label>
        </p>

        <p>
            <label>Текст:
                <textarea name="content">Новый текст статьи</textarea>
            </label>
        </p>

        <p>
            <label>Автор:
                <input type="text" name="author_name" value="Me">
            </label>
        </p>

        <p>
            <label>Рейтинг:
                <input type="number" name="rating" min="1" max="5" value="5">
            </label>
        </p>

        <button type="submit">Изменить запись</button>
    </form>
</body>
</html>
