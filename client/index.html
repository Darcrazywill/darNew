<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Получить совет</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0b1d3a, #123c73, #1d5fa8);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        }

        h1, h2 {
            margin-top: 0;
        }

        .advice-box {
            min-height: 180px;
            background: rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
        }

        .advice-id {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 10px;
        }

        .advice-text {
            font-size: 24px;
            line-height: 1.5;
            font-weight: bold;
        }

        .buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 12px 18px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-main {
            background: #4da3ff;
            color: white;
        }

        .btn-save {
            background: #7ed6ff;
            color: #07203f;
        }

        .btn-delete {
            background: #ff6b81;
            color: white;
            padding: 8px 12px;
            font-size: 13px;
        }

        .status {
            margin-top: 15px;
            min-height: 20px;
            opacity: 0.85;
        }

        .favorite-item {
            background: rgba(255,255,255,0.08);
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .favorite-id {
            font-size: 12px;
            opacity: 0.7;
            margin-bottom: 8px;
        }

        .favorite-text {
            line-height: 1.45;
            margin-bottom: 12px;
        }

        .empty {
            opacity: 0.7;
            padding: 16px 0;
        }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;
            }

            .advice-text {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Генератор советов</h1>
            <p>Нажмите кнопку, чтобы получить случайный совет.</p>

            <div class="advice-box">
                <div class="advice-id" id="adviceId">Совет ещё не получен</div>
                <div class="advice-text" id="adviceText">Нажмите «Получить совет»</div>
            </div>

            <div class="buttons">
                <button class="btn-main" id="getAdviceBtn">Получить совет</button>
                <button class="btn-save" id="saveAdviceBtn">Сохранить совет</button>
            </div>

            <div class="status" id="status"></div>
        </div>

        <div class="card">
            <h2>Сохранённые советы</h2>
            <div id="favorites"></div>
        </div>
    </div>

    <script>
        const adviceIdEl = document.getElementById('adviceId');
        const adviceTextEl = document.getElementById('adviceText');
        const statusEl = document.getElementById('status');
        const favoritesEl = document.getElementById('favorites');
        const getAdviceBtn = document.getElementById('getAdviceBtn');
        const saveAdviceBtn = document.getElementById('saveAdviceBtn');

        const STORAGE_KEY = 'saved_advices';
        let currentAdvice = null;

        function loadFavorites() {
            const data = localStorage.getItem(STORAGE_KEY);
            return data ? JSON.parse(data) : [];
        }

        function saveFavorites(favorites) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
        }

        function escapeHtml(text) {
            return text
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function renderFavorites() {
            const favorites = loadFavorites();

            if (favorites.length === 0) {
                favoritesEl.innerHTML = '<div class="empty">Нет сохранённых советов.</div>';
                return;
            }

            favoritesEl.innerHTML = favorites.map(item => `
                <div class="favorite-item">
                    <div class="favorite-id">Совет #${item.id}</div>
                    <div class="favorite-text">${escapeHtml(item.advice)}</div>
                    <button class="btn-delete" onclick="deleteFavorite(${item.id})">Удалить</button>
                </div>
            `).join('');
        }

        function deleteFavorite(id) {
            const favorites = loadFavorites().filter(item => item.id !== id);
            saveFavorites(favorites);
            renderFavorites();
            statusEl.textContent = 'Совет удалён.';
        }

        async function getAdvice() {
            statusEl.textContent = 'Загрузка совета...';

            try {
                const response = await fetch(`https://api.adviceslip.com/advice?ts=${Date.now()}`, {
                    cache: 'no-store'
                });

                if (!response.ok) {
                    throw new Error('Ошибка HTTP: ' + response.status);
                }

                const data = await response.json();
                currentAdvice = data.slip;

                adviceIdEl.textContent = `Совет #${currentAdvice.id}`;
                adviceTextEl.textContent = currentAdvice.advice;
                statusEl.textContent = 'Совет получен.';
            } catch (error) {
                adviceIdEl.textContent = 'Ошибка';
                adviceTextEl.textContent = 'Не удалось получить совет.';
                statusEl.textContent = 'Ошибка загрузки.';
                console.error(error);
            }
        }

        function saveCurrentAdvice() {
            if (!currentAdvice) {
                statusEl.textContent = 'Сначала получите совет.';
                return;
            }

            const favorites = loadFavorites();
            const exists = favorites.some(item => item.id === currentAdvice.id);

            if (exists) {
                statusEl.textContent = 'Этот совет уже сохранён.';
                return;
            }

            favorites.unshift(currentAdvice);
            saveFavorites(favorites);
            renderFavorites();
            statusEl.textContent = 'Совет сохранён.';
        }

        getAdviceBtn.addEventListener('click', getAdvice);
        saveAdviceBtn.addEventListener('click', saveCurrentAdvice);

        renderFavorites();
    </script>
</body>
</html>
